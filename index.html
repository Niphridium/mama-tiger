<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>Mama Tiger — развитие детей в семье</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Приложение для родителей детей 4–18 лет: практика дня по возрасту (чтение, счёт, логика, английский, жизненные навыки), цели и дела по каждому ребёнку, пересмотр раз в несколько недель, время и бюджет семьи. Данные остаются в браузере на этом устройстве." />
    <meta name="ai-disclosure" content="Материалы подготовлены с помощью ИИ." />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#F5F5F7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0E1014" media="(prefers-color-scheme: dark)" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 160 160'%3E%3Cdefs%3E%3ClinearGradient id='b' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23FFB38A'/%3E%3Cstop offset='.48' stop-color='%23FF8A4C'/%3E%3Cstop offset='1' stop-color='%23EE5B1A'/%3E%3C/linearGradient%3E%3CradialGradient id='s' cx='.92' cy='1' r='.7'%3E%3Cstop offset='0' stop-color='%237A2A06' stop-opacity='.38'/%3E%3Cstop offset='1' stop-color='%237A2A06' stop-opacity='0'/%3E%3C/radialGradient%3E%3C/defs%3E%3Crect width='160' height='160' rx='36' fill='url(%23b)'/%3E%3Crect width='160' height='160' rx='36' fill='url(%23s)'/%3E%3Cpath d='M40 111L63 49M68 111L82 73M96 111L119 49' fill='none' stroke='%231A120D' stroke-width='16' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <script>
      // Тема до первой отрисовки: выбор родителя (mama-tiger:prefs; прежде — тема в mama-tiger:v1), по умолчанию — светлая.
      try {
        var prefs = JSON.parse(localStorage.getItem('mama-tiger:prefs') || 'null');
        var legacy = JSON.parse(localStorage.getItem('mama-tiger:v1') || 'null');
        var theme = prefs && (prefs.theme === 'light' || prefs.theme === 'dark' || prefs.theme === 'system') ? prefs.theme : legacy && legacy.theme === 'dark' ? 'dark' : 'light';
        if (theme !== 'system') {
          document.documentElement.setAttribute('data-theme', theme);
          // строка браузера — в цвет выбранной темы (= --bg; те же значения — в Layout.tsx)
          var metas = document.querySelectorAll('meta[name="theme-color"]');
          for (var i = 0; i < metas.length; i++) metas[i].setAttribute('content', theme === 'dark' ? '#0E1014' : '#F5F5F7');
        }
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    </script>
    <style>
      /* фон и текст до загрузки CSS — те же, что --bg и --ink в src/index.css */
      :root { --bg: #F5F5F7; --ink: #16161C; }
      @media (prefers-color-scheme: dark) { :root:not([data-theme='light']) { --bg: #0E1014; --ink: #F1F3F7; color-scheme: dark; } }
      :root[data-theme='dark'] { --bg: #0E1014; --ink: #F1F3F7; color-scheme: dark; }
      html { min-height: 100%; background: var(--bg); color: var(--ink); }
      body { margin: 0; min-height: 100%; }
    </style>
    <script type="module" crossorigin src="./assets/index-5xrz1uWZ.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/style-Bl46iQUQ.css">
  </head>
  <body>
    <div id="root"></div>
    <noscript>Включите JavaScript, чтобы открыть сайт.</noscript>
  </body>
</html>
