<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>Мама-тигр 7–9 — план на 12 недель</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="План на 12 недель для родителей детей 7–9 лет (1–3 класс) под программу РК: распорядок дня, замеры, чек-лист, секции Алматы и олимпиады. Сон, движение и отдых — в приоритете." />
    <meta name="ai-disclosure" content="Материалы подготовлены с помощью ИИ." />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f6f3ee" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#13151c" media="(prefers-color-scheme: dark)" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='10' fill='%23e8590c'/%3E%3Cpath d='M9 12 L15 20 L9 28 M20 9 L20 31 M31 12 L25 20 L31 28' fill='none' stroke='%231b1d26' stroke-width='3.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
    <script>
      // Тема до первой отрисовки: выбор родителя из localStorage (если доступен), иначе — системная.
      try {
        var saved = JSON.parse(localStorage.getItem('mama-tiger:v1') || 'null');
        if (saved && (saved.theme === 'light' || saved.theme === 'dark')) {
          document.documentElement.setAttribute('data-theme', saved.theme);
          // строка браузера — в цвет выбранной темы (= --paper; те же значения — в Layout.tsx)
          var metas = document.querySelectorAll('meta[name="theme-color"]');
          for (var i = 0; i < metas.length; i++) metas[i].setAttribute('content', saved.theme === 'dark' ? '#13151c' : '#f6f3ee');
        }
        if (saved && (saved.age === 7 || saved.age === 8 || saved.age === 9)) document.documentElement.setAttribute('data-age', String(saved.age));
      } catch (e) {}
    </script>
    <style>
      :root { --paper: #f6f3ee; --ink: #1b1d26; }
      @media (prefers-color-scheme: dark) { :root:not([data-theme='light']) { --paper: #13151c; --ink: #f2f0eb; color-scheme: dark; } }
      :root[data-theme='dark'] { --paper: #13151c; --ink: #f2f0eb; color-scheme: dark; }
      html, body { min-height: 100%; }
      body { margin: 0; background: var(--paper); color: var(--ink); }
    </style>
    <script type="module" crossorigin src="./assets/index-duI-hhYZ.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/style-CeWFgsrS.css">
  </head>
  <body>
    <div id="root"></div>
    <noscript>Включите JavaScript, чтобы открыть сайт.</noscript>
  </body>
</html>
