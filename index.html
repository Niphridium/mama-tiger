<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>Мама-тигр 7–9 — план на 12 недель</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="План на 12 недель для родителей детей 7–9 лет (1–3 класс) под программу РК: распорядок дня, замеры, чек-лист, секции Алматы и олимпиады. Сон, движение и отдых — в приоритете." />
    <meta name="ai-disclosure" content="Материалы подготовлены с помощью ИИ." />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#F6F2EE" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0B0B0D" media="(prefers-color-scheme: dark)" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 160 160'%3E%3Cdefs%3E%3ClinearGradient id='b' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23FFB38A'/%3E%3Cstop offset='.48' stop-color='%23FF8A4C'/%3E%3Cstop offset='1' stop-color='%23EE5B1A'/%3E%3C/linearGradient%3E%3CradialGradient id='s' cx='.92' cy='1' r='.7'%3E%3Cstop offset='0' stop-color='%237A2A06' stop-opacity='.38'/%3E%3Cstop offset='1' stop-color='%237A2A06' stop-opacity='0'/%3E%3C/radialGradient%3E%3C/defs%3E%3Crect width='160' height='160' rx='36' fill='url(%23b)'/%3E%3Crect width='160' height='160' rx='36' fill='url(%23s)'/%3E%3Cpath d='M40 111L63 49M68 111L82 73M96 111L119 49' fill='none' stroke='%231A120D' stroke-width='16' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <script>
      // Тема до первой отрисовки: выбор родителя из localStorage (если доступен), иначе — системная.
      try {
        var saved = JSON.parse(localStorage.getItem('mama-tiger:v1') || 'null');
        if (saved && (saved.theme === 'light' || saved.theme === 'dark')) {
          document.documentElement.setAttribute('data-theme', saved.theme);
          // строка браузера — в цвет выбранной темы (= --bg; те же значения — в Layout.tsx)
          var metas = document.querySelectorAll('meta[name="theme-color"]');
          for (var i = 0; i < metas.length; i++) metas[i].setAttribute('content', saved.theme === 'dark' ? '#0B0B0D' : '#F6F2EE');
        }
        if (saved && (saved.age === 7 || saved.age === 8 || saved.age === 9)) document.documentElement.setAttribute('data-age', String(saved.age));
      } catch (e) {}
    </script>
    <style>
      /* фон и текст до загрузки CSS — те же, что --bg и --ink в src/index.css */
      :root { --bg: #F6F2EE; --ink: #15161A; }
      @media (prefers-color-scheme: dark) { :root:not([data-theme='light']) { --bg: #0B0B0D; --ink: #F5F5F7; color-scheme: dark; } }
      :root[data-theme='dark'] { --bg: #0B0B0D; --ink: #F5F5F7; color-scheme: dark; }
      html { min-height: 100%; background: var(--bg); color: var(--ink); }
      body { margin: 0; min-height: 100%; }
    </style>
    <script type="module" crossorigin src="./assets/index-D-mzXIyk.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/style-DLHi2AKU.css">
  </head>
  <body>
    <div id="root"></div>
    <noscript>Включите JavaScript, чтобы открыть сайт.</noscript>
  </body>
</html>
